[platformio]
default_envs = esp32s3

; Host-side unit tests for lib/proto and lib/app: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror

; ESP32-S3-DevKitC-1 N8R8 (8 MB flash, 8 MB octal PSRAM). Provisional until the real
; board arrives (decision D9); pins live in src/config.h.
[env:esp32s3]
platform = platformio/espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
build_src_flags = -std=gnu++17 -Wall -Wextra
lib_deps =
  lovyan03/LovyanGFX@1.3.0
  h2zero/NimBLE-Arduino@2.5.2
